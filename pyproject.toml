[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-breast-duke"
version = "0.1.0"
description = "MRI and clinical-feature fusion experiments on the Duke breast MRI dataset"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["mriBreastDuke*", "mama_mia*"]
