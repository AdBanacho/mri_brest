# Trusted shell configuration, sourced by run_experiment.slurm (Bash 4.3+).
# Edit plain values here. No TOML, Python planner, or constants.py lookup.
# Relative paths are resolved against this file's directory before submission.
PYTHON_BIN=python3
MODULES=(ML-bundle) # Loaded only inside compute jobs; () uses your environment.
MAX_JOBS=0         # 0 = full training grid; otherwise first N configurations.
MAX_CONCURRENT=4   # Slurm array throttle for training AND validation.
CLEAN_BEFORE_TRAIN=false    # Opt in to deleting old checkpoints/TensorBoard logs.
CLEAN_BEFORE_VALIDATE=false # Opt in to deleting validation results and summary.

declare -A PATHS=(
  [clinical_features_file]=mriBreastDuke/features/Clinical_and_Other_Features.xlsx
  [metadata_file]=mriBreastDuke/features/Duke-Breast-Cancer-MRI_v2_20220609-nbia-digest.xlsx
  [imaging_features_file]=mriBreastDuke/features/Imaging_Features.xlsx
  [annotation_boxes_file]=mriBreastDuke/features/Annotation_Boxes.xlsx
  [image_root]=/net/storage/pr3/plgrid/plggsiwomipipan/aBanacho_duke_oncotype/tciaNifti
  [prepared_root]=/net/scratch/hscra/plgrid/plgabanacho/preparedToTrain
  [subtraction_root]=/net/scratch/hscra/plgrid/plgabanacho/preparedToTrainSubtraction
  [logs_root]=lightning_logs
  [checkpoint_root]=/net/scratch/hscra/plgrid/plgabanacho/check_points
  [validation_root]=validation_charts
  [summary_root]=validation_charts/summary
  [slurm_logs]=logs
)

# Resource settings become sbatch arguments in the Slurm controller.
# Slurm does not expand shell variables in #SBATCH directives.
declare -A JOB_TRAIN=(
  [job_name]=mri_train [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_VALIDATE=(
  [job_name]=mri_validate [cpus]=16 [gpus]=1 [memory]=48G [time]=24:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
declare -A JOB_SUMMARIZE=(
  [job_name]=mri_summarize [cpus]=2 [gpus]=0 [memory]=8G [time]=02:00:00
  [account]=plgvirtudrel2026-gpu-gh200 [partition]=plgrid-gpu-gh200
)
EXTRA_SBATCH_TRAIN=()     # e.g. (--qos=normal --constraint=...)
EXTRA_SBATCH_VALIDATE=()
EXTRA_SBATCH_SUMMARIZE=()

# Keys match the training CLI, without leading --. Booleans are true/false.
# target_size uses three space-separated dimensions (D H W).
declare -A TRAIN=(
  [seed]=42 [target_size]='256 256 64'
  [epoch]=30 [num_folds]=5 [threshold_calibration_folds]=5 [num_workers]=4
  [feature_selector]=lasso [imaging_patient_id_column]='Patient ID'
  [allow_missing_imaging_features]=false [include_sensitive]=false
  [use_annotation_boxes]=true
  [lasso_cv_folds]=5 [lasso_cs]=20 [lasso_max_iter]=5000
  [lasso_tolerance]=1e-4 [lasso_min_features]=1 [lasso_n_jobs]=8 [lasso_plot_top_n]=30
  [xgb_n_estimators]=300 [xgb_max_depth]=3 [xgb_learning_rate]=0.03
  [xgb_subsample]=0.8 [xgb_colsample_bytree]=0.8 [xgb_n_jobs]=8
  [mlp_hidden_layers]='128,64' [mlp_alpha]=1e-4
  [mlp_learning_rate]=1e-3 [mlp_max_iter]=500
  # Optional constructor/Trainer options use the model CLI's JSON object syntax.
  [xgb_extra_json]='{}' [mlp_extra_json]='{}'
  [mri_extra_json]='{}' [trainer_extra_json]='{}'
)

# Each value contains choices separated by |. A single choice is valid.
# Any TRAIN key can be a grid axis; keys are sorted for stable task ordering.
# feature_groups uses commas WITHIN a choice, | BETWEEN choices.
declare -A TRAIN_GRID=(
  [mri_model]='densenet121|resnet10|resnet18'
  [subtraction_mode]=none
  [feature_groups]='clinical|clinical,kinetic,morphology,heterogeneity'
  [feature_model]='xgboost|mlp'
  [batch_size]=4 [positive_boost]=1.0 [sensitivity_lambda]='0.05|0.2' [lr]=1e-4
)

# Validation inherits matching training options and experiment IDs.
declare -A VALIDATE=( [num_workers]=4 )
declare -A VALIDATE_GRID=( [fusion_alpha]=0.5 ) # e.g. '0.25|0.5|0.75'
declare -A SUMMARIZE=( [expected_folds]=5 [top_n]=20 [include_incomplete]=false )
